name: android
# Nyeko (private repo): manual only, to save GitHub Actions minutes.
# Run it from the Actions tab → this workflow → Run workflow.
on:
  workflow_dispatch:
    inputs:
      full:
        description: "Also run lint (slow). Off: tests and the debug APK only."
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-24.04
    # Nyeko: tests and a debug APK (as a run artifact). Releases come from the "Release Nyeko" workflow only.
    permissions:
      contents: read
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-node@v7
        with: { node-version: '22' }
      - uses: gradle/actions/setup-gradle@v5
      - name: English strings are up to date
        run: node scripts/gen-strings.mjs --check
      - name: Tests and debug build
        run: ./gradlew testDebugUnitTest assembleDebug --console=plain
      - name: Lint
        if: ${{ inputs.full }}
        run: ./gradlew lint --console=plain
      # Also kept as a run artifact (Actions → this run → Artifacts → nyeko-android-apk).
      - uses: actions/upload-artifact@v7
        with:
          name: nyeko-android-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
      - name: No ads, billing or analytics (condition of the author's permission)
        run: "! grep -rEi 'admob|play-services-ads|billingclient|firebase-analytics|crashlytics|com.google.android.gms' app/build.gradle.kts"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-test-reports
          path: android/app/build/reports
