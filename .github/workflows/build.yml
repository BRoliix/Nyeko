name: Build

# Nyeko (private repo): manual only, to save GitHub Actions minutes.
# Run it from the Actions tab → this workflow → Run workflow.
# The installers (Mac, Windows, Android) are made by the "Release Nyeko" workflow.
#
# Tick "Publish the phone web app" to put phone/web on Cloudflare Pages (nyeko-phone.pages.dev) instead, the same as
# `npx wrangler pages deploy phone/web --project-name nyeko-phone --branch main` on your Mac. It needs the repository
# secrets CLOUDFLARE_API_TOKEN (a token with "Cloudflare Pages: Edit") and CLOUDFLARE_ACCOUNT_ID.
on:
  workflow_dispatch:
    inputs:
      site:
        description: "Publish the phone web app (phone/web) to Cloudflare Pages instead"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  site:
    if: inputs.site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish phone/web to nyeko-phone.pages.dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID first"; exit 1
          fi
          grep -o 'const VERSION = "[^"]*"' phone/web/app.js
          npx --yes wrangler@3 pages deploy phone/web --project-name nyeko-phone --branch main --commit-dirty=true

  build:
    if: ${{ !inputs.site }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: cd NotchBuddy && xcodegen

      - name: Test screen geometry
        run: bash scripts/test-screen-geometry.sh

      - name: Test Claude hook detection
        run: bash scripts/test-claude-hooks.sh

      - name: Test the nb-hook relay (socket, decisions, remote sessions)
        run: python3 scripts/test-nb-hook.py

      - name: Test display choice
        run: bash scripts/test-display-choice.sh

      - name: Test island placement (notch and the four corners)
        run: bash scripts/test-island-placement.sh

      - name: Test parallel Claude Code sessions
        run: bash scripts/test-session-registry.sh

      - name: Test approval queue
        run: bash scripts/test-approval-queue.sh

      - name: Test question queue
        run: bash scripts/test-question-queue.sh

      - name: Test the session board (sessions behind a pill, popping out, places)
        run: bash scripts/test-session-board.sh

      - name: Test session titles in the relay
        run: python3 scripts/test-session-title.py

      - name: Test the chat on your subscription (Claude Code, Antigravity, Gemini, Codex, Cursor, Copilot)
        run: bash scripts/test-cli-relay.sh

      - name: Test a subscription run on stand-in tools (stdin, no thinking, signed out, time limit)
        run: bash scripts/test-cli-relay-run.sh

      - name: Test Mail triage (rules, banned words, VIPs, search)
        run: bash scripts/test-mail-triage.sh

      - name: Test the settings search (accents, words, labels)
        run: bash scripts/test-settings-search.sh

      - name: Test Antigravity permission rules
        run: bash scripts/test-agy-permissions.sh

      - name: Test Flow dictation keys
        run: bash scripts/test-flow-keys.sh

      - name: Test Flow text (snippets, dictionary, numbers)
        run: bash scripts/test-flow-text.sh

      - name: Test the work streak (Mochi sleepy after long work, fresh after a break)
        run: bash scripts/test-work-streak.sh

      - name: Test Notetaker transcript (speakers, echo, summary, Markdown)
        run: bash scripts/test-notetaker.sh

      - name: Test WhatsApp (gateway payloads, signatures, inbox, filters)
        run: bash scripts/test-whatsapp.sh

      - name: Test Mac update (releases, versions, where it may replace itself)
        run: bash scripts/test-mac-update.sh

      - name: Test What's new
        run: bash scripts/test-whats-new-mac.sh

      - name: Test Claude Desktop chat (stop button labels)
        run: bash scripts/test-claude-desktop-chat.sh

      - name: Desktop Mochi and gaze tests
        run: bash scripts/test-desktop-mochi.sh

      - name: Test auto-close timing
        run: bash scripts/test-auto-close.sh

      - name: Test Mac translations (Traditional Chinese coverage, format arguments, catalog keys)
        run: python3 scripts/test-localization.py

      - name: Test open on hover
        run: bash scripts/test-island-hover.sh

      - name: Wake phrase tests
        run: bash scripts/test-voice-wake.sh

      - name: Energy VAD tests
        run: bash scripts/test-voice-vad.sh

      - name: Voice island FSM tests
        run: bash scripts/test-voice-island.sh

      - name: Voice IntentParser tests
        run: bash scripts/test-voice-intent.sh

      - name: Voice EntityResolver tests
        run: bash scripts/test-voice-entity.sh

      - name: Voice ActionRunner tests
        run: bash scripts/test-voice-runner.sh


      - name: Voice query tests

        run: bash scripts/test-voice-query.sh

      - name: Voice conversation end-phrase tests
        run: bash scripts/test-voice-conversation.sh

      - name: Voice gender tests
        run: bash scripts/test-voice-gender.sh

      - name: Test terminal target
        run: bash scripts/test-terminal-target.sh

      - name: Test Claude Code host
        run: bash scripts/test-claude-host.sh

      - name: Test link filter
        run: bash scripts/test-safe-links.sh

      - name: Test Claude response text
        run: bash scripts/test-claude-response.sh

      - name: Test chat parsing
        run: bash scripts/test-chat-parsing.sh

      - name: Test plan gauge
        run: bash scripts/test-plan-gauge.sh

      - name: Test ask question
        run: bash scripts/test-ask-question.sh

      - name: Test the App Store review moments
        run: bash scripts/test-review-policy.sh

      - name: Test the new-session launcher
        run: bash scripts/test-session-launch.sh

      - name: Test the Android link (pairing, framing, admission, approvals, certificate)
        run: bash scripts/test-android-link.sh

      - name: Diff engine tests
        run: bash scripts/test-diff-engine.sh

      - name: GitHub pulse tests
        run: bash scripts/test-github-pulse.sh

      - name: GitHub activity tests
        run: bash scripts/test-github-activity.sh

      - name: Wardrobe tests
        run: bash scripts/test-wardrobe.sh

      - name: Pill colour tests
        run: bash scripts/test-pill-colors.sh

      - name: Claude settings file tests
        run: bash scripts/test-claude-settings.sh

      - name: Turn end policy tests
        run: bash scripts/test-turn-end-policy.sh

      - name: Voice spotter generation tests
        run: bash scripts/test-voice-spotter-gen.sh

      - name: Voice wake blocked tests
        run: bash scripts/test-voice-wake-blocked.sh

      - name: Conversation context tests
        run: bash scripts/test-conversation-context.sh

      - name: Codex automatic-review filter tests
        run: bash scripts/test-codex-auto-review.sh

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project NotchBuddy/NotchBuddy.xcodeproj \
            -scheme NotchBuddy \
            -configuration Release \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO 2>&1 | tee build.log || {
              # Compiler errors as annotations, readable without downloading the log.
              grep -E "error:" build.log | sort -u | head -30 | sed 's/^/::error::/'
              exit 1
            }

      - name: Build App Store target (unsigned)
        run: |
          xcodebuild \
            -project NotchBuddy/NotchBuddy.xcodeproj \
            -scheme CoucouAppStore \
            -configuration Debug \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Build iPhone link spike (Mac, DebugCloud, unsigned)
        run: |
          xcodebuild \
            -project NotchBuddy/NotchBuddy.xcodeproj \
            -scheme NotchBuddyCloud \
            -configuration DebugCloud \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Build iPhone link spike (Mac, ReleaseCloud, unsigned)
        run: |
          xcodebuild \
            -project NotchBuddy/NotchBuddy.xcodeproj \
            -scheme NotchBuddy \
            -configuration ReleaseCloud \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Build iPhone app (unsigned)
        run: |
          xcodebuild \
            -project NotchBuddy/NotchBuddy.xcodeproj \
            -scheme CoucouPhone \
            -destination 'generic/platform=iOS' \
            build \
            CODE_SIGNING_ALLOWED=NO
