<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nyeko · design preview</title>
<link rel="stylesheet" href="/style.css">
<!-- A still picture of the web app with made-up computers, for checking the design (node phone/tests/preview-server.mjs).
     Nothing connects: app.js skips the relay when NYEKO_PREVIEW is set. ?view=now|mac|nyo|session|settings|launch|pair|quiet -->
<script>
  const view = new URLSearchParams(location.search).get("view") || "now";
  const relay = "wss://relay.example.workers.dev";
  const A = "A".repeat(22), B = "B".repeat(22), C = "C".repeat(22);
  const quiet = view === "quiet";
  const apps = ["Activity Monitor", "Affinity", "App Store", "Blender", "Books", "Calculator", "Calendar", "Chess", "Figma", "Finder",
    "Google Chrome", "Mail", "Maps", "Messages", "Music", "Notes", "Preview", "Safari", "Spotify", "Terminal", "Visual Studio Code"]
    .map((n) => ({ id: n, name: n }));
  const mac = {
    nowPlaying: { title: "Midnight City", artist: "M83", source: "Spotify", playing: true, position: 84, duration: 244 },
    volume: 62, muted: false, timer: null, recording: false, battery: { percent: 73, charging: false },
    next: { title: "Design review", when: "Today · 4:30 PM" },
    apps: ["Finder", "Safari", "Google Chrome", "Mail", "Notes", "Calendar", "Terminal", "Claude"].map((n) => ({ id: n, name: n })),
    projects: [{ id: "p1", name: "Kestrel", where: "~/Kestrel" }, { id: "p2", name: "portfolio", where: "~/Projects/portfolio" },
      { id: "p3", name: "relay", where: "~/Kestrel/android/relay" }],
  };
  const items = [
    { r: "you", t: "Why does the build fail on the Windows runner?" },
    { r: "tools", t: "Read windows/src-tauri/Cargo.toml\nBash cargo check --lib" },
    { r: "nyo", t: "The ring crate needs a newer Visual Studio toolchain on the runner. I pinned it in the workflow." },
    { r: "you", t: "curl -I https://apple.com" },
    { r: "tools", t: "Bash curl -I https://apple.com" },
    { r: "nyo", t: "301 Redirect → https://www.apple.com/\n\nApple's apex domain redirects to www. No caching (Cache-Control: no-store), served through their CDN." },
  ];
  window.NYEKO_PREVIEW = {
    computers: [
      { p: { room: A, name: "Neko's MacBook Pro · greenhawk_nyek", relay }, live: { status: "open", os: "macos", desktop: "Neko's MacBook Pro · greenhawk_nyek",
          sessions: quiet ? [] : [{ pillId: "t1", agent: "Recalling previous conversation", state: "working", statusText: "Terminal · Bash" },
                                  { pillId: "t2", agent: "kestrel", state: "finished", statusText: "VS Code · Done in 4 min" }],
          mac, apps, macAt: Date.now(), usage: { claude: { fiveHour: { pct: 42 }, sevenDay: { pct: 88 } } },
          approval: view === "now" ? { tool: "Bash", command: "uname -a && sw_vers && sysctl -n hw.physicalcpu hw.logicalcpu", at: Date.now(), fingerprint: "x" } : null } },
      { p: { room: B, name: "IT · green", relay }, live: { status: "open", os: "windows", desktop: "IT · green",
          sessions: quiet ? [] : [{ pillId: "w1", agent: "Claude Code", state: "idle", statusText: "Windows Terminal" }] } },
      { p: { room: C, name: "Neko's MacBook Pro · nekonyo", relay }, live: { status: "connecting", os: "macos", desktop: "Neko's MacBook Pro · nekonyo" } },
    ],
    state: {
      tab: { quiet: "now", pair: "add" }[view] || view, current: A,
      thread: view === "session" ? { comp: A, id: "t1", title: "Recalling previous conversation", sub: "", sending: [], open: {},
        data: { title: "Recalling previous conversation", host: "Terminal", folder: "Kestrel", state: "idle", readable: true, canMessage: true, items, queued: [] } } : null,
      chat: view === "nyo" ? [{ me: true, text: "What's next today?", comp: A }, { me: false, text: "Design review at 4:30. Nothing else after that.", comp: A }] : [],
    },
  };
</script>
<script type="module" src="/app.js"></script>
</head>
<body><div id="app"></div></body>
</html>
